# Public collection only. Shared Umami/Grafana administration stays private.
location = /telemetry/script.js {
    limit_except GET { deny all; }
    proxy_pass http://192.168.0.110:8090/script.js;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /telemetry/api/send {
    limit_except POST { deny all; }
    client_max_body_size 16k;
    proxy_pass http://192.168.0.110:8090/api/send;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /telemetry/ { return 404; }
