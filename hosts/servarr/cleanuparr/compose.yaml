name: cleanuparr

services:
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest@sha256:9f74fa60bbf84c82b86f69fbef75189dd3e38408f99fd9c1895736185c4620b9
    container_name: cleanuparr
    restart: unless-stopped
    environment:
      PORT: "11011"
      BASE_PATH: ""
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
      TZ: "${TZ:-Europe/Amsterdam}"
    labels:
      # Cleanuparr owns a schema-bearing SQLite configuration database and its
      # cleanup policy is version-sensitive. Update it manually after reviewing
      # release notes and running the focused dry-run/connection checks.
      wud.watch: "false"
    ports:
      - "192.168.0.102:11011:11011/tcp"
    volumes:
      - /docker/cleanuparr:/config:rw
    networks:
      - servarr
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:11011/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  servarr:
    external: true
    name: servarr-hello_default
