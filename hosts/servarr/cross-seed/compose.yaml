name: cross-seed

services:
  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:6
    container_name: cross-seed
    restart: unless-stopped
    user: "1000:1000"
    command: daemon
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.trigger.include: "docker.backupgated"
    volumes:
      - /docker/cross-seed:/config:rw
      # One common mount is required for hardlinks between existing qBittorrent
      # data and tracker-specific link trees.
      - /data:/data:rw
    networks:
      - servarr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const net=require("net");
          const socket=net.connect({host:"127.0.0.1",port:2468});
          const timer=setTimeout(()=>{socket.destroy();process.exit(1)},5000);
          socket.on("connect",()=>{clearTimeout(timer);socket.end()});
          socket.on("close",()=>process.exit(0));
          socket.on("error",()=>{clearTimeout(timer);process.exit(1)});
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  servarr:
    external: true
    name: servarr-hello_default
