name: cross-seed

services:
  prowlarr-download-proxy:
    image: python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
    container_name: cross-seed-prowlarr-proxy
    restart: unless-stopped
    user: "1000:1000"
    init: true
    command:
      - python3
      - /app/prowlarr-download-proxy.py
    environment:
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "9697"
      PROWLARR_CONFIG: /prowlarr/config.xml
      PROWLARR_DB: /prowlarr/prowlarr.db
      PROWLARR_URL: http://127.0.0.1:9696
      PUBLIC_URL: http://gluetun:9697
      PYTHONDONTWRITEBYTECODE: "1"
    labels:
      # Stateless compatibility code; update the pinned Python base manually
      # with an end-to-end private-torrent retrieval test.
      wud.watch: "false"
    volumes:
      - ./prowlarr-download-proxy.py:/app/prowlarr-download-proxy.py:ro
      - /docker/prowlarr:/prowlarr:ro
    network_mode: "container:gluetun"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          response=urllib.request.urlopen("http://127.0.0.1:9697/health",timeout=5);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M

  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:6
    container_name: cross-seed
    # deploy.sh promotes this to unless-stopped only after the persistent
    # manual-indexer approval marker exists.
    restart: "no"
    user: "1000:1000"
    command: daemon
    depends_on:
      prowlarr-download-proxy:
        condition: service_healthy
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.trigger.include: "docker.backupgated"
    volumes:
      - /docker/cross-seed:/config:rw
      # One common mount is required for hardlinks between existing qBittorrent
      # data and tracker-specific link trees.
      - /data:/data:rw
    networks:
      - servarr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const net=require("net");
          const socket=net.connect({host:"127.0.0.1",port:2468});
          const timer=setTimeout(()=>{socket.destroy();process.exit(1)},5000);
          socket.on("connect",()=>{clearTimeout(timer);socket.end()});
          socket.on("close",()=>process.exit(0));
          socket.on("error",()=>{clearTimeout(timer);process.exit(1)});
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  servarr:
    external: true
    name: servarr-hello_default
