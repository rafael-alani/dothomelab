name: speech
services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    container_name: speaches
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports:
      - "192.168.0.110:8092:8000"
    environment:
      API_KEY: ${SPEECH_API_KEY:?Initialize the speech service key on PVE}
      ENABLE_UI: "false"
      LOG_LEVEL: warning
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: "2"
      WHISPER__NUM_WORKERS: "1"
      STT_MODEL_TTL: "60"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - /srv/appdata/docker/speech/models:/home/ubuntu/.cache/huggingface/hub
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    labels:
      wud.watch: "false"
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://127.0.0.1:8000/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
