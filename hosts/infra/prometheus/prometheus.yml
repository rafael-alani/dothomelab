global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    site: afa

rule_files:
  - /etc/prometheus/fleet-alerts.yml
  - /etc/prometheus/blog/alerts.yml
  - /etc/prometheus/production/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: blog-blackbox
    static_configs:
      - targets: [192.168.0.110:9115]
        labels: {project: blog, environment: staging, service_name: blog, host: afa, guest: staging, guest_id: "114"}

  - job_name: blog-alloy
    static_configs:
      - targets: [192.168.0.114:12345]
        labels: {project: blog, environment: staging, service_name: blog, host: afa, guest: staging, guest_id: "114"}

  - job_name: blog-https
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe
    static_configs:
      - targets: [https://blog.staging.rafael.media/]
        labels: {project: blog, environment: staging, service_name: blog, host: afa, guest: staging, guest_id: "114", page: home, module: staging_blog_home_https}
      - targets: [https://blog.staging.rafael.media/about]
        labels: {project: blog, environment: staging, service_name: blog, host: afa, guest: staging, guest_id: "114", page: about, module: staging_blog_about_https}
      - targets: [https://blog.staging.rafael.media/technical-write-ups/ai/machine-and-deep-learning]
        labels: {project: blog, environment: staging, service_name: blog, host: afa, guest: staging, guest_id: "114", page: article, module: staging_blog_article_https}
      - targets: [https://blog.staging.rafael.media/feed.xml]
        labels: {project: blog, environment: staging, service_name: blog, host: afa, guest: staging, guest_id: "114", page: feed, module: staging_blog_feed_https}
    relabel_configs: &blog_probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.0.110:9115
      - action: labeldrop
        regex: module

  - job_name: blog-origin
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe
    static_configs:
      - targets: [http://192.168.0.114:8084/]
        labels: {project: blog, environment: staging, service_name: blog, host: afa, guest: staging, guest_id: "114", page: origin, module: staging_blog_home_origin}
    relabel_configs: *blog_probe_relabel

  # Discovery files are empty while production is scaffolded. Activation fills
  # them only after the main release and public route pass their checks.
  - job_name: blog-production-blackbox
    file_sd_configs:
      - files: [/etc/prometheus/production/blackbox.json]
  - job_name: blog-production-alloy
    file_sd_configs:
      - files: [/etc/prometheus/production/alloy.json]
  - job_name: blog-production-https
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe
    file_sd_configs:
      - files: [/etc/prometheus/production/https.json]
    relabel_configs: &production_probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.0.110:9115
      - action: labeldrop
        regex: module
  - job_name: blog-production-origin
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /probe
    file_sd_configs:
      - files: [/etc/prometheus/production/origin.json]
    relabel_configs: *production_probe_relabel

  - job_name: fleet-alloy
    static_configs:
      - targets: [192.168.0.110:12345]
        labels: {project: observability, environment: infra, service_name: fleet, host: afa, guest: infra, guest_id: "110"}
  - job_name: homelab-endpoints
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /probe
    file_sd_configs:
      - files: [/etc/prometheus/targets.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.0.110:9115
      - action: labeldrop
        regex: module
