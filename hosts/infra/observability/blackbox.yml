modules:
  staging_blog_home_https:
    prober: http
    timeout: 8s
    http: &staging_https
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_not_ssl: true
      headers:
        User-Agent: dothomelab-blackbox
      fail_if_body_not_matches_regexp:
        - '<link rel="canonical" href="https://blog\.staging\.rafael\.media/"'
  staging_blog_about_https:
    prober: http
    timeout: 8s
    http:
      <<: *staging_https
      fail_if_body_not_matches_regexp:
        - '<link rel="canonical" href="https://blog\.staging\.rafael\.media/about"'
  staging_blog_article_https:
    prober: http
    timeout: 8s
    http:
      <<: *staging_https
      fail_if_body_not_matches_regexp:
        - '<h1[^>]*>Machine and Deep Learning</h1>'
  staging_blog_feed_https:
    prober: http
    timeout: 8s
    http:
      <<: *staging_https
      fail_if_body_not_matches_regexp:
        - '<feed xmlns="http://www.w3.org/2005/Atom">'
  staging_blog_home_origin:
    prober: http
    timeout: 8s
    http:
      <<: *staging_https
      fail_if_not_ssl: false
      fail_if_ssl: true
  production_blog_home_https:
    prober: http
    timeout: 8s
    http: &production_https
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_not_ssl: true
      headers:
        User-Agent: dothomelab-blackbox
      fail_if_body_not_matches_regexp:
        - '<link rel="canonical" href="https://rafael\.ink/"'
  production_blog_about_https:
    prober: http
    timeout: 8s
    http:
      <<: *production_https
      fail_if_body_not_matches_regexp:
        - '<link rel="canonical" href="https://rafael\.ink/about"'
  production_blog_article_https:
    prober: http
    timeout: 8s
    http:
      <<: *production_https
      fail_if_body_not_matches_regexp:
        - '<h1[^>]*>Machine and Deep Learning</h1>'
  production_blog_feed_https:
    prober: http
    timeout: 8s
    http:
      <<: *production_https
      fail_if_body_not_matches_regexp:
        - '<feed xmlns="http://www.w3.org/2005/Atom">'
  production_blog_home_origin:
    prober: http
    timeout: 8s
    http:
      <<: *production_https
      fail_if_not_ssl: false
      fail_if_ssl: true
  https_reachable:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_not_ssl: true
      valid_status_codes: [200, 204, 401, 403]
      headers: {User-Agent: dothomelab-blackbox}
