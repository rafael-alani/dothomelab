name: blog-publisher
services:
  export:
    image: dothomelab/blog-publisher:1
    build: .
    user: "1000:1000"
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    volumes:
      - /vault/shared/media/obsidian:/vault:ro
      - /srv/appdata/docker/staging/blog/editorial:/output
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1
    labels:
      wud.watch: "false"
