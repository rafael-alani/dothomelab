worker_processes auto;
pid /run/dothomelab-blog-web/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  map $request_uri $request_path { ~^([^?]*) $1; }
  map $http_user_agent $synthetic {
    default "none";
    "blog-healthcheck" "healthcheck";
    ~*blackbox "blackbox";
  }
  log_format request_json escape=json
    '{"timestamp":"$time_iso8601","method":"$request_method",'
    '"path":"$request_path","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"synthetic":"$synthetic"}';
  access_log syslog:server=unix:/dev/log,tag=dothomelab-blog,nohostname request_json;
  client_body_temp_path /run/dothomelab-blog-web/client;
  proxy_temp_path /run/dothomelab-blog-web/proxy;
  fastcgi_temp_path /run/dothomelab-blog-web/fastcgi;
  uwsgi_temp_path /run/dothomelab-blog-web/uwsgi;
  scgi_temp_path /run/dothomelab-blog-web/scgi;
  server {
    listen ADDRESS:8084;
    absolute_redirect off;
    root SITE_ROOT/current/client;
    index index.html;
    etag on;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "ROBOTS_VALUE" always;
    include SITE_ROOT/current/redirects.conf;
    LISTENING_LOCATION
    location ~* \.svg$ {
      add_header Cache-Control "no-cache" always;
      add_header X-Robots-Tag "ROBOTS_VALUE" always;
      add_header Content-Security-Policy "sandbox; script-src 'none'" always;
      try_files $uri =404;
    }
    location / { try_files $uri $uri/index.html =404; }
    error_page 404 /404.html;
  }
}
