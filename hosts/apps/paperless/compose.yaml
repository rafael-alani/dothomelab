name: paperless

x-wud-labels: &wud-labels
  wud.watch: "true"
  wud.watch.digest: "true"
  wud.trigger.include: "docker.backupgated"

services:
  broker:
    image: valkey/valkey:9
    container_name: paperless-broker
    restart: unless-stopped
    labels:
      wud.watch: "false"
    volumes:
      - /srv/appdata/docker/paperless/valkey:/data
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      start_period: 10s
      timeout: 5s
      interval: 30s
      retries: 5

  db:
    image: postgres:18
    container_name: paperless-db
    restart: unless-stopped
    labels:
      wud.watch: "false"
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: "${PAPERLESS_DB_PASSWORD:?set PAPERLESS_DB_PASSWORD in /root/.env on Proxmox}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /srv/appdata/docker/paperless/postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}"
      start_period: 15s
      timeout: 5s
      interval: 30s
      retries: 5

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    labels: *wud-labels
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: "${PAPERLESS_DB_PASSWORD:?set PAPERLESS_DB_PASSWORD in /root/.env on Proxmox}"
      PAPERLESS_SECRET_KEY: "${PAPERLESS_SECRET_KEY:?set PAPERLESS_SECRET_KEY in /root/.env on Proxmox}"
      PAPERLESS_ADMIN_USER: "${PAPERLESS_ADMIN_USER:?set PAPERLESS_ADMIN_USER in /root/.env on Proxmox}"
      PAPERLESS_ADMIN_MAIL: "${PAPERLESS_ADMIN_MAIL:?set PAPERLESS_ADMIN_MAIL in /root/.env on Proxmox}"
      PAPERLESS_ADMIN_PASSWORD: "${PAPERLESS_ADMIN_PASSWORD:?set PAPERLESS_ADMIN_PASSWORD in /root/.env on Proxmox}"
      PAPERLESS_URL: https://paperless.rafael.media
      PAPERLESS_TIME_ZONE: "${TZ:-Europe/Amsterdam}"
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_USE_X_FORWARD_HOST: "true"
      PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO","https"]'
      PAPERLESS_EMPTY_TRASH_DIR: /usr/src/paperless/media/trash
      USERMAP_UID: "1000"
      USERMAP_GID: "1000"
    ports:
      - "192.168.0.112:8002:8000/tcp"
    volumes:
      - /srv/appdata/docker/paperless/data:/usr/src/paperless/data
      - /srv/appdata/docker/paperless/media:/usr/src/paperless/media
      - /srv/appdata/docker/paperless/export:/usr/src/paperless/export
      - /srv/appdata/docker/paperless/consume:/usr/src/paperless/consume
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8000/ >/dev/null || exit 1
      start_period: 2m
      timeout: 10s
      interval: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G

  paperless-gpt:
    image: icereed/paperless-gpt:latest
    container_name: paperless-gpt
    restart: unless-stopped
    labels: *wud-labels
    depends_on:
      webserver:
        condition: service_healthy
    environment:
      PUID: "10001"
      PGID: "10001"
      PAPERLESS_BASE_URL: http://webserver:8000
      PAPERLESS_PUBLIC_URL: https://paperless.rafael.media
      PAPERLESS_API_TOKEN: "${PAPERLESS_GPT_API_TOKEN:?set PAPERLESS_GPT_API_TOKEN in /root/.env on Proxmox}"
      LLM_PROVIDER: openai
      LLM_MODEL: "${PAPERLESS_GPT_LLM_MODEL:-gpt-4o-mini}"
      LLM_LANGUAGE: "${PAPERLESS_GPT_LLM_LANGUAGE:-English}"
      OPENAI_API_KEY: "${PAPERLESS_GPT_OPENAI_API_KEY:?set PAPERLESS_GPT_OPENAI_API_KEY in /root/.env on Proxmox}"
      OCR_PROVIDER: llm
      VISION_LLM_PROVIDER: openai
      VISION_LLM_MODEL: "${PAPERLESS_GPT_VISION_MODEL:-gpt-4o-mini}"
      OCR_PROCESS_MODE: image
      PDF_UPLOAD: "false"
      PDF_REPLACE: "false"
      LOG_LEVEL: info
    ports:
      - "192.168.0.112:8003:8080/tcp"
    volumes:
      - /srv/appdata/docker/paperless/gpt/prompts:/app/prompts
      - /srv/appdata/docker/paperless/gpt/config:/app/config
      - /srv/appdata/docker/paperless/gpt/db:/app/db
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=/dev/null http://127.0.0.1:8080/ || exit 1
      start_period: 30s
      timeout: 10s
      interval: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
