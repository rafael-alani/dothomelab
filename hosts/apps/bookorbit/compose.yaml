name: bookorbit

services:
  bookorbit:
    image: ghcr.io/bookorbit/bookorbit:latest
    container_name: bookorbit
    restart: unless-stopped
    init: true
    depends_on:
      bookorbit-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      POSTGRES_HOST: bookorbit-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: "${BOOKORBIT_DB_PASSWORD:?set BOOKORBIT_DB_PASSWORD in /root/.env on Proxmox}"
      POSTGRES_DB: bookorbit
      JWT_SECRET: "${BOOKORBIT_JWT_SECRET:?set BOOKORBIT_JWT_SECRET in /root/.env on Proxmox}"
      SETUP_BOOTSTRAP_TOKEN: "${BOOKORBIT_SETUP_BOOTSTRAP_TOKEN:?set BOOKORBIT_SETUP_BOOTSTRAP_TOKEN in /root/.env on Proxmox}"
      APP_URL: "${BOOKORBIT_APP_URL:-https://bookorbit.rafael.media}"
      CLIENT_URL: "${BOOKORBIT_APP_URL:-https://bookorbit.rafael.media}"
      PUID: "1000"
      PGID: "1000"
      BOOKORBIT_FIX_PERMISSIONS: "false"
      LIBRARY_BROWSE_ROOT: /library
      BOOK_DOCK_PATH: /data/book-dock
      TZ: "${TZ:-Europe/Amsterdam}"
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.trigger.include: "docker.backupgated"
    ports:
      - "192.168.0.112:3002:3000/tcp"
    volumes:
      - /srv/appdata/docker/bookorbit/app:/data
      - /data/media/books/ebooks:/library/ebooks:ro
      - /data/media/books/pdfs:/library/pdfs:ro
      - /data/media/comics:/library/comics:ro
      - /data/media/mangas:/library/mangas:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3072M

  bookorbit-db:
    image: pgvector/pgvector:pg18
    container_name: bookorbit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: "${BOOKORBIT_DB_PASSWORD:?set BOOKORBIT_DB_PASSWORD in /root/.env on Proxmox}"
      POSTGRES_DB: bookorbit
      PGDATA: /var/lib/postgresql/data/pgdata
    labels:
      wud.watch: "false"
    volumes:
      - /srv/appdata/docker/bookorbit/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M
