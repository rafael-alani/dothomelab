name: snapotter

services:
  snapotter:
    image: snapotter/snapotter:latest
    container_name: snapotter
    restart: unless-stopped
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.trigger.include: "docker.backupgated"
    depends_on:
      snapotter-db:
        condition: service_healthy
      snapotter-redis:
        condition: service_healthy
    environment:
      AUTH_ENABLED: "true"
      DEFAULT_USERNAME: "${SNAPOTTER_INITIAL_USERNAME:?set SNAPOTTER_INITIAL_USERNAME in /root/.env on Proxmox}"
      DEFAULT_PASSWORD: "${SNAPOTTER_INITIAL_PASSWORD:?set SNAPOTTER_INITIAL_PASSWORD in /root/.env on Proxmox}"
      DATABASE_URL: "postgres://snapotter:${SNAPOTTER_DB_PASSWORD:?set SNAPOTTER_DB_PASSWORD in /root/.env on Proxmox}@snapotter-db:5432/snapotter"
      REDIS_URL: redis://snapotter-redis:6379
      TRUST_PROXY: "true"
      PUID: "999"
      PGID: "999"
      MAX_UPLOAD_SIZE_MB: "500"
    ports:
      - "192.168.0.112:1349:1349/tcp"
    volumes:
      - /srv/appdata/docker/snapotter/data:/data
      - /srv/appdata/docker/snapotter/workspace:/tmp/workspace
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    shm_size: 2gb
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - --max-time
        - "5"
        - http://127.0.0.1:1349/api/v1/health
      start_period: 60s
      timeout: 5s
      interval: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  snapotter-db:
    image: postgres:17-alpine
    container_name: snapotter-db
    restart: unless-stopped
    labels:
      wud.watch: "false"
    environment:
      POSTGRES_DB: snapotter
      POSTGRES_USER: snapotter
      POSTGRES_PASSWORD: "${SNAPOTTER_DB_PASSWORD:?set SNAPOTTER_DB_PASSWORD in /root/.env on Proxmox}"
    volumes:
      - /srv/appdata/docker/snapotter/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --dbname=snapotter --username=snapotter
      start_period: 15s
      timeout: 5s
      interval: 10s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1G

  snapotter-redis:
    image: redis:8-alpine
    container_name: snapotter-redis
    restart: unless-stopped
    labels:
      wud.watch: "false"
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - /srv/appdata/docker/snapotter/redis:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      start_period: 10s
      timeout: 5s
      interval: 10s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M
