name: aurral

services:
  aurral:
    image: ghcr.io/lklynet/aurral:2.0.0-test.7@sha256:a2ce2e4ae4767c3fb445728c3af2e972823b874c7813d290a2054b736100bbf6
    container_name: aurral
    restart: unless-stopped
    init: true
    environment:
      TZ: "${TZ:-Europe/Amsterdam}"
      PUID: "1000"
      PGID: "1000"
      TRUST_PROXY: "1"
      DOWNLOAD_FOLDER: /aurral-flows
      WEEKLY_FLOW_FOLDER: /aurral-flows
      FILE_BROWSE_ROOTS: /aurral-flows,/data/media/music,/slskd-downloads
    labels:
      wud.watch: "false"
    ports:
      - "192.168.0.112:3001:3001/tcp"
    volumes:
      - /srv/appdata/docker/aurral/data:/config:rw
      - /srv/appdata/docker/aurral/flows:/aurral-flows:rw
      - /data/media/music:/data/media/music:ro
      - /slskd-downloads:/slskd-downloads:ro
    networks:
      - slskd-droppedneedle
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2048M

networks:
  slskd-droppedneedle:
    external: true
    name: slskd-droppedneedle
