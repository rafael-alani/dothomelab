name: staging-ff
services:
  web:
    image: dothomelab-staging/ff-web:${STAGING_IMAGE_TAG:?}
    build:
      context: ${STAGING_SOURCE:?}
      dockerfile: Dockerfile.staging
      args:
        NEXT_PUBLIC_APP_URL: https://ff.staging.rafael.media
    restart: unless-stopped
    init: true
    env_file:
      - path: ${STAGING_ENV:?}
        format: raw
    ports:
      - 192.168.0.114:8082:4000
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /workspace/apps/v4/.next/cache:size=128m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/create').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    labels:
      wud.watch: "false"
      dothomelab.staging.commit: ${STAGING_COMMIT:?}
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
