name: staging-film-introspect
services:
  api:
    image: dothomelab-staging/film-introspect-api:${STAGING_IMAGE_TAG:?}
    build:
      context: ${STAGING_SOURCE:?}
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ${STAGING_ENV:?}
        format: raw
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_PATH: /data/introspect.db
      BETTER_AUTH_URL: https://film-introspect.staging.rafael.media
      WEB_ORIGIN: https://film-introspect.staging.rafael.media
      APP_AUTH_ENABLED: "false"
      ALLOW_SIGN_UP: "false"
    volumes:
      - ${STAGING_DATA:?}:/data
    healthcheck:
      test: [CMD, bun, -e, "const r = await fetch('http://127.0.0.1:3001/api/health'); if (!r.ok || !(await r.json()).ok) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    labels:
      wud.watch: "false"
      dothomelab.staging.commit: ${STAGING_COMMIT:?}
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  web:
    image: dothomelab-staging/film-introspect-web:${STAGING_IMAGE_TAG:?}
    build:
      context: ${STAGING_SOURCE:?}
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 192.168.0.114:8080:80
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      wud.watch: "false"
      dothomelab.staging.commit: ${STAGING_COMMIT:?}
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
