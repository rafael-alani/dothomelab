name: staging-blog
services:
  web:
    image: dothomelab-staging/blog:${STAGING_IMAGE_TAG:?}
    build:
      context: ${STAGING_SOURCE:?}
      dockerfile: Dockerfile
      args:
        CONTENT_PREVIEW: "1"
        PUBLIC_SITE_URL: https://blog.staging.rafael.media
        ROBOTS_TAG: noindex, nofollow
        PUBLIC_UMAMI_SCRIPT_URL: https://analytics.staging.rafael.media/script.js
        PUBLIC_UMAMI_WEBSITE_ID: a3417da8-b984-49df-9e5b-88ecb9b2f6da
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    ports:
      - 192.168.0.114:8084:8080
    volumes:
      - /srv/appdata/docker/staging/blog/listening/f60cdd679714:/usr/share/nginx/html/listening:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -U blog-healthcheck -q -O /dev/null http://127.0.0.1:8080/ && wget -U blog-healthcheck -q -O /dev/null http://127.0.0.1:8080/about"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      wud.watch: "false"
      dothomelab.staging.commit: ${STAGING_COMMIT:?}
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: journald
      options: {tag: dothomelab-blog}
