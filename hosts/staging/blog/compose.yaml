name: staging-blog
services:
  web:
    image: dothomelab-staging/blog:${STAGING_IMAGE_TAG:?}
    build:
      context: ${STAGING_SOURCE:?}
      dockerfile: Dockerfile
      args:
        PUBLIC_SITE_URL: https://blog.staging.rafael.media
        ROBOTS_TAG: noindex, nofollow
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    ports:
      - 192.168.0.114:8084:8080
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/about"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      wud.watch: "false"
      dothomelab.staging.commit: ${STAGING_COMMIT:?}
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
