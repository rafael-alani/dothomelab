name: blog-observability

x-runtime: &runtime
  restart: unless-stopped
  labels:
    wud.watch: "false"
    dothomelab.project: blog
    dothomelab.environment: staging
    dothomelab.observability.commit: ${BLOG_OBSERVABILITY_COMMIT:-unrecorded}
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  alloy:
    <<: *runtime
    image: grafana/alloy:v1.21.1
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/data
      - /etc/alloy/config.alloy
    ports:
      - 192.168.0.114:12345:12345
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/journal:ro
      - /srv/appdata/docker/staging/blog-observability/alloy:/data
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    # Upstream image has no HTTP client; verify /-/ready and ingestion externally.
