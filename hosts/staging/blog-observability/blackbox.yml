modules:
  blog_home_https:
    prober: http
    timeout: 8s
    http: &https
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_not_ssl: true
      headers:
        User-Agent: dothomelab-blackbox
      fail_if_body_not_matches_regexp:
        - '<link rel="canonical" href="https://blog\.staging\.rafael\.media/"'
  blog_about_https:
    prober: http
    timeout: 8s
    http:
      <<: *https
      fail_if_body_not_matches_regexp:
        - '<link rel="canonical" href="https://blog\.staging\.rafael\.media/about"'
  blog_article_https:
    prober: http
    timeout: 8s
    http:
      <<: *https
      fail_if_body_not_matches_regexp:
        - '<h1[^>]*>Machine and Deep Learning</h1>'
  blog_feed_https:
    prober: http
    timeout: 8s
    http:
      <<: *https
      fail_if_body_not_matches_regexp:
        - '<feed xmlns="http://www.w3.org/2005/Atom">'
  blog_home_origin:
    prober: http
    timeout: 8s
    http:
      <<: *https
      fail_if_not_ssl: false
      fail_if_ssl: true
